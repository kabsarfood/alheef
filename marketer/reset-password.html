<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1E2A38">
  <title>تعيين كلمة مرور جديدة — الهيف</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/dashboard/css/dashboard.css">
  <link rel="stylesheet" href="/dashboard/css/login.css">
  <link rel="stylesheet" href="/dashboard/css/mobile.css">
  <link rel="stylesheet" href="/marketer/css/login.css?v=1">
</head>
<body class="login-page login-page--marketer">
  <div class="login-page__bg"></div>
  <div class="login-card login-card--marketer">
    <div class="login-card__brand">
      <img src="/images/logo-alheef.png" alt="الهيف العقارية" class="login-card__logo" width="160" height="48" loading="eager">
      <h1 class="login-card__title">تعيين كلمة مرور جديدة</h1>
      <p class="login-card__subtitle">مكتب الهيف للخدمات العقارية</p>
    </div>
    <form id="reset-form" class="login-form">
      <div id="reset-message" class="login-message" role="status" aria-live="polite"></div>
      <div class="form-group">
        <label for="reset-password">كلمة المرور الجديدة</label>
        <input type="password" name="password" id="reset-password" minlength="6" required autocomplete="new-password">
      </div>
      <div class="form-group">
        <label for="reset-confirm">تأكيد كلمة المرور</label>
        <input type="password" name="confirmPassword" id="reset-confirm" minlength="6" required autocomplete="new-password">
      </div>
      <button type="submit" class="btn btn-primary login-form__submit">حفظ كلمة المرور</button>
    </form>
    <p class="login-footer"><a href="/marketer/login.html" class="login-card__back">← العودة لتسجيل الدخول</a></p>
  </div>
  <script src="/marketer/js/reset-password.js"></script>
</body>
</html>
