<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تعيين كلمة مرور جديدة — الهيف</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/dashboard/css/dashboard.css">
  <link rel="stylesheet" href="/dashboard/css/login.css">
  <style>
    .login-form label { display:block; margin:0.65rem 0 0.35rem; font-weight:600; font-size:0.9rem; }
    .login-form input { width:100%; padding:0.65rem 0.75rem; border:1px solid var(--border); border-radius:var(--radius); font-family:inherit; }
    .login-message { min-height:1.25rem; font-size:0.9rem; margin-bottom:0.5rem; }
    .login-message.error { color:var(--danger); }
    .login-message.success { color:#1a7a3a; }
    .login-card__logo { width:56px; height:56px; margin:0 auto 1rem; border-radius:var(--radius); background:var(--gold-bg); border:1px solid var(--gold-border); display:flex; align-items:center; justify-content:center; font-size:1.5rem; font-weight:800; color:var(--gold); }
  </style>
</head>
<body class="login-page">
  <div class="login-page__bg"></div>
  <div class="login-card">
    <div class="login-card__brand">
      <div class="login-card__logo">ه</div>
      <h1>كلمة مرور جديدة</h1>
      <p>مسوقي مكتب الهيف للخدمات العقارية</p>
    </div>
    <form id="reset-form" class="login-form">
      <div id="reset-message" class="login-message"></div>
      <label>كلمة المرور الجديدة</label>
      <input type="password" name="password" minlength="6" required autocomplete="new-password">
      <label>تأكيد كلمة المرور</label>
      <input type="password" name="confirmPassword" minlength="6" required autocomplete="new-password">
      <button type="submit" class="btn btn-primary">حفظ كلمة المرور</button>
    </form>
    <p class="login-footer" style="text-align:center;margin-top:1rem"><a href="/marketer/login.html">← العودة لتسجيل الدخول</a></p>
  </div>
  <script src="/marketer/js/reset-password.js"></script>
</body>
</html>
