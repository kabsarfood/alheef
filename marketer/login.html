<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1E2A38">
  <title>دخول فريق الهيف</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/dashboard/css/dashboard.css?v=14">
  <link rel="stylesheet" href="/dashboard/css/login.css?v=3">
  <link rel="stylesheet" href="/dashboard/css/mobile.css">
  <link rel="stylesheet" href="/marketer/css/login.css?v=2">
</head>
<body class="login-page login-page--marketer">
  <div class="login-page__bg"></div>
  <div class="login-card login-card--marketer">
    <div class="login-card__brand">
      <img src="/images/logo-alheef.png?v=6" alt="الهيف العقارية" class="login-card__logo" width="240" height="76" loading="eager">
      <h1 class="login-card__title">لوحة المسوقين</h1>
      <p class="login-card__subtitle">مكتب الهيف للخدمات العقارية</p>
    </div>

    <form id="login-form" class="login-form">
      <div id="login-message" class="login-message" role="status" aria-live="polite"></div>
      <p class="login-hint">الدخول للمسوق المعتمد من الأدمن عبر رمز واتساب.</p>
      <div class="form-group">
        <label for="login-phone">رقم الجوال</label>
        <input type="tel" name="phone" id="login-phone" placeholder="05xxxxxxxx" dir="ltr" required inputmode="tel" autocomplete="tel">
      </div>
      <button type="submit" class="btn btn-primary login-form__submit">دخول</button>
    </form>

    <form id="otp-form" class="login-form" hidden>
      <div id="otp-message" class="login-message" role="status" aria-live="polite"></div>
      <p class="login-otp-hint">انسخ الرمز من رسالة واتساب واكتبه هنا. لا يظهر الرمز في الموقع.</p>
      <div class="form-group">
        <label for="otp-code">رمز التوثيق</label>
        <input type="text" id="otp-code" name="code" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code" dir="ltr" required>
      </div>
      <button type="submit" class="btn btn-primary login-form__submit" id="otp-btn">دخول</button>
      <div class="login-otp-actions">
        <button type="button" class="btn btn-outline btn-sm" id="otp-resend">إعادة الإرسال</button>
        <button type="button" class="btn btn-outline btn-sm" id="otp-back">تغيير الرقم</button>
      </div>
    </form>

    <p class="login-footer"><a href="/" class="login-card__back">← العودة للموقع</a></p>
  </div>
  <script src="/marketer/js/auth.js"></script>
  <script src="/js/logout-alerts.js?v=1" defer></script>
  <script src="/js/otp-consent.js?v=1"></script>
  <script src="/marketer/js/login.js?v=10"></script>
</body>
</html>
