  <meta id="og-title" property="og:title" content="الهيف للخدمات العقارية">

  <link rel="stylesheet" href="/css/pwa.css">
  <title id="page-title">تفاصيل العقار | الهيف</title>
  <style>
    .property-page { background: #faf8f5; min-height: 100vh; padding-bottom: 3rem; }
    .property-detail { max-width: 900px; margin: 0 auto; padding: 2rem 1rem; }
    .property-detail__hero { border-radius: 16px; overflow: hidden; aspect-ratio: 16/10; background: #e8e4df; margin-bottom: 1.5rem; }
    .property-detail__hero img { width: 100%; height: 100%; object-fit: cover; }
    .property-detail__title { font-size: 1.75rem; font-weight: 800; color: #1e2a38; margin: 0 0 0.5rem; }
    .property-detail__meta { color: rgba(30,42,56,.65); font-weight: 600; margin-bottom: 1rem; }
    .property-detail__price { font-size: 1.5rem; font-weight: 800; color: #c5a46d; margin-bottom: 1rem; }
    .property-detail__grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 0.75rem; margin: 1.5rem 0; }
    .property-detail__chip { background: #fff; border: 1px solid rgba(30,42,56,.08); border-radius: 10px; padding: 0.75rem; text-align: center; }
    .property-detail__chip strong { display: block; font-size: 0.7rem; color: rgba(30,42,56,.5); }
    .property-detail__desc { line-height: 1.8; color: rgba(30,42,56,.75); white-space: pre-wrap; margin-bottom: 0.5rem; }
    .property-detail__section-title { font-size: 1.15rem; font-weight: 800; color: #1e2a38; margin: 1.5rem 0 0.75rem; }
    .property-detail__actions { display: flex; flex-wrap: wrap; gap: 0.65rem; margin-top: 1.5rem; }
    .property-loading { text-align: center; padding: 4rem; font-weight: 700; color: #1e2a38; }
  </style>
</head>
<body class="property-page map-page">
  <header class="header">
    <div class="container header__inner">
      <a href="/" class="logo logo--header">
        <img src="/images/logo-alheef.png" alt="الهيف" width="120" height="48">
      </a>
      <nav class="nav" id="nav" aria-label="التنقل">
        <a href="/" class="nav__link">الرئيسية</a>
        <a href="/map.html" class="nav__link" title="الخريطة العقارية">الخريطة</a>
        <a href="/ejar" class="nav__link" title="عقود إيجار إلكترونية">عقود إيجار</a>
        <a href="/#offers" class="nav__link">العروض</a>
        <span class="nav__portal-label">دخول</span>
        <a href="/dashboard/login.html" class="nav__link nav__link--portal nav__link--admin">لوحة التحكم — أدمن</a>
        <a href="/marketer/login.html" class="nav__link nav__link--portal nav__link--team">دخول فريق الهيف</a>
      </nav>
      <div class="header__actions">
        <details class="header__login">
          <summary class="btn btn-outline btn-sm header__login-toggle">دخول</summary>
          <div class="header__login-menu" role="menu">
            <a href="/dashboard/login.html" class="header__login-item" role="menuitem" title="لوحة تحكم الأدمن">أدمن</a>
            <a href="/marketer/login.html" class="header__login-item" role="menuitem" title="دخول فريق الهيف">الفريق</a>
          </div>
        </details>
        <button class="menu-toggle" id="menu-toggle" type="button" aria-label="فتح القائمة" aria-expanded="false" aria-controls="nav">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </header>
  <div class="nav-overlay" id="nav-overlay" aria-hidden="true"></div>

  <main class="property-detail container" id="property-root">
    <p class="property-loading">جاري تحميل العقار…</p>
  </main>

  <script src="/js/analytics.js" defer></script>
  <script src="/js/pwa.js" defer></script>
  <script src="/js/nav-mobile.js?v=5" defer></script>
  <script src="/js/property.js?v=5" defer></script>
</body>
</html>
