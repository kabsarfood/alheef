<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="theme-color" content="#1E2A38">
  <title>العروض الخاصة</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      background: #f6f3ee;
      color: #1E2A38;
      font-family: Cairo, sans-serif;
    }
    .card {
      width: min(100%, 440px);
      background: #fff;
      border-radius: 18px;
      padding: 2rem 1.4rem;
      text-align: center;
      box-shadow: 0 16px 40px rgba(30, 42, 56, 0.08);
    }
    h1 { margin: 0 0 .75rem; font-size: 1.45rem; }
    p { margin: 0; line-height: 1.8; color: #3d4b5c; }
    a { color: #1E2A38; font-weight: 700; }
  </style>
</head>
<body>
  <main class="card">
    <h1>العروض الخاصة</h1>
    <p>الدخول إلى العروض الخاصة يتم بدعوة من الهيف فقط. إذا وصلك رابط من المكتب، افتحه من نفس الرسالة.</p>
    <p style="margin-top:1rem"><a href="/">العودة للرئيسية</a></p>
  </main>
</body>
</html>
