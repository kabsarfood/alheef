<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="theme-color" content="#1E2A38">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="الهيف">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png?v=5">
  <meta property="og:type" content="website">
  <meta property="og:title" content="_ أهلاً بكم _">
  <meta property="og:description" content="العروض الخاصة — أدخل رمز الدخول">
  <meta property="og:image" content="/assets/app-icon.png?v=5">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="_ أهلاً بكم _">
  <meta name="twitter:image" content="/assets/app-icon.png?v=5">
  <title>عروض خاصة</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/private-offers.css?v=12">
  <link rel="stylesheet" href="/css/pwa.css">
</head>
<body class="private-page">

  <div id="pdf-toast" class="pdf-toast" hidden aria-live="polite"></div>
  <div id="pdf-render-root" class="pdf-render-root" aria-hidden="true"></div>

  <div id="gate-view" class="private-gate">
    <div class="private-gate__card">
      <img src="/assets/app-icon.png?v=5" alt="" class="private-brand__icon" width="88" height="88">
      <p class="private-brand__welcome">_ أهلاً بكم _</p>
      <h1>العروض الخاصة</h1>
      <p>هذه الصفحة خاصة. أدخل رمز الدخول الذي استلمته من فريقنا.</p>
      <form id="gate-form">
        <label for="access-code">رمز الدخول</label>
        <input id="access-code" name="code" type="text" autocomplete="off" required placeholder="أدخل الرمز">
        <button type="submit" class="btn btn-gold btn-block">دخول</button>
        <p id="gate-error" class="private-gate__error" hidden></p>
      </form>
    </div>
  </div>

  <div id="offers-view" class="private-offers is-hidden" aria-hidden="true">
    <header class="private-offers__header">
      <img src="/assets/app-icon.png?v=5" alt="" class="private-brand__icon private-brand__icon--header" width="72" height="72">
      <p class="private-brand__welcome private-brand__welcome--header">_ أهلاً بكم _</p>
      <h1>عروض خاصة لك</h1>
      <p>اختر العرض المناسب وأرسل رقم العرض لفريقنا للمتابعة</p>
    </header>

    <section class="private-toolbar" aria-label="بحث وتصفية">
      <div class="private-toolbar__inner">
        <div class="private-search">
          <span class="private-search__icon" aria-hidden="true">🔍</span>
          <input id="offers-search" type="search" placeholder="ابحث بالحي، الشارع، رقم العرض، القطعة..." autocomplete="off">
        </div>
        <div class="private-type-tabs" id="type-tabs" role="tablist" aria-label="نوع العقار"></div>
        <div class="private-type-filters" id="type-filters" hidden></div>
        <p class="private-results-count" id="results-count" hidden></p>
      </div>
    </section>

    <main class="container">
      <div id="offers-container">
        <div class="loading"><div class="spinner"></div></div>
      </div>
    </main>
  </div>

  <div id="photo-lightbox" class="photo-lightbox" hidden role="dialog" aria-modal="true" aria-label="معرض الصور">
    <button type="button" class="photo-lightbox__close" id="lightbox-close" aria-label="إغلاق">×</button>
    <button type="button" class="photo-lightbox__nav photo-lightbox__nav--prev" id="lightbox-prev" aria-label="الصورة السابقة">‹</button>
    <div class="photo-lightbox__stage">
      <img id="lightbox-img" src="" alt="">
      <p class="photo-lightbox__counter" id="lightbox-counter"></p>
    </div>
    <button type="button" class="photo-lightbox__nav photo-lightbox__nav--next" id="lightbox-next" aria-label="الصورة التالية">›</button>
    <div class="photo-lightbox__thumbs" id="lightbox-thumbs"></div>
  </div>

  <script src="/js/analytics.js" defer></script>
  <script src="/js/pwa.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" crossorigin="anonymous"></script>
  <script src="/js/private-offers.js?v=16"></script>
</body>
</html>
