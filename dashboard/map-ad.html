<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>إضافة إعلان — الهيف</title>
  <link rel="icon" type="image/png" href="/assets/favicon.png?v=6">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/dashboard/css/dashboard.css?v=14">
  <link rel="stylesheet" href="/dashboard/css/mobile.css?v=2">
  <style>
    .map-ad { display: grid; gap: 14px; }
    .map-ad__box, .map-ad__card { background: #fff; border: 1px solid rgba(30,42,56,.08); border-radius: 16px; padding: 14px; }
    .map-ad textarea, .map-ad input, .map-ad select { width: 100%; min-height: 46px; border-radius: 12px; border: 1px solid rgba(30,42,56,.14); padding: 10px 12px; font: inherit; }
    .map-ad textarea { min-height: 180px; resize: vertical; }
    .map-ad__photos { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; }
    .map-ad__photo { position: relative; width: 96px; height: 96px; flex: 0 0 96px; border-radius: 12px; overflow: hidden; background: #f3efe8; }
    .map-ad__photo img { width: 100%; height: 100%; object-fit: cover; }
    .map-ad__photo button { position: absolute; top: 4px; left: 4px; border: 0; border-radius: 8px; background: #fff; width: 26px; height: 26px; }
    .map-ad__grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
    @media (min-width: 800px) { .map-ad__grid { grid-template-columns: 1fr 1fr; } }
    .map-ad__actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .map-ad__note { color: #8a5a12; font-weight: 700; }
    #map-ad-otp[hidden], #map-ad-review[hidden], #map-ad-done[hidden] { display: none; }
  </style>
</head>
<body>
  <div class="app" id="app"></div>
  <script src="/dashboard/js/auth.js?v=2"></script>
  <script src="/dashboard/js/api.js?v=3"></script>
  <script src="/dashboard/js/layout.js?v=13"></script>
  <script src="/dashboard/js/map-ad.js?v=1"></script>
</body>
</html>
