<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <link rel="manifest" href="/manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="الهيف">
  <link rel="stylesheet" href="/css/pwa.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1E2A38">
  <link rel="icon" type="image/png" href="/assets/favicon.png?v=6">
  <link rel="shortcut icon" href="/assets/favicon.png?v=6">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png?v=6">
  <title>تسجيل الدخول — الهيف</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/dashboard/css/dashboard.css?v=14">
  <link rel="stylesheet" href="/dashboard/css/mobile.css?v=2">
  <link rel="stylesheet" href="/dashboard/css/login.css?v=2">
</head>
<body class="login-page">
  <div class="login-page__bg"></div>
  <div class="login-card">
    <div class="login-card__brand">
      <img src="/images/logo-alheef.png?v=6" alt="الهيف العقارية" class="login-card__logo" width="240" height="76">
      <h1>الهيف العقارية</h1>
      <p>لوحة التحكم</p>
    </div>
    <form id="login-form" class="login-form">
      <div id="login-error" class="login-error" hidden></div>
      <div class="form-group">
        <label for="phone">رقم الجوال</label>
        <input type="tel" id="phone" name="phone" placeholder="05xxxxxxxx" dir="ltr" required autocomplete="username" inputmode="tel">
      </div>
      <div class="form-group">
        <label for="password">كلمة المرور</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-gold login-form__submit" id="login-btn">دخول</button>
    </form>
    <a href="/" class="login-card__back">← العودة للموقع</a>
  </div>
  <script src="/dashboard/js/auth.js"></script>
  <script src="/dashboard/js/login.js"></script>
  <script src="/js/pwa.js" defer></script>
</body>
</html>
